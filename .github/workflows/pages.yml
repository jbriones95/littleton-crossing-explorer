name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site artifact
        env:
          VOTE_API_URL: ${{ vars.VOTE_API_URL }}
        run: |
          mkdir -p _site/data _site/n712kv0.6.0
          cp index.html app.js styles.css favicon.svg CNAME _site/
          cp data/streets.json _site/data/
          cp n712kv0.6.0/*.woff2 _site/n712kv0.6.0/
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=${GITHUB_SHA}\"|" _site/index.html
          sed -i "s|href=\"favicon.svg\"|href=\"favicon.svg?v=${GITHUB_SHA}\"|" _site/index.html
          sed -i "s|src=\"app.js\"|src=\"app.js?v=${GITHUB_SHA}\"|" _site/index.html
          node - <<'NODE'
          const fs = require('fs');
          const path = '_site/index.html';
          const configuredUrl = (process.env.VOTE_API_URL || '').trim();
          let apiUrl = '';
          if (configuredUrl) {
            const parsed = new URL(configuredUrl);
            if (parsed.protocol !== 'https:' || parsed.pathname !== '/' || parsed.search || parsed.hash || parsed.username || parsed.password) {
              throw new Error('VOTE_API_URL must be an HTTPS origin without a path, query, or credentials.');
            }
            apiUrl = parsed.origin;
          }
          const voting = apiUrl ? 'enabled' : 'disabled';
          const apiAttribute = apiUrl ? ` data-votes-api="${apiUrl}"` : '';
          let html = fs.readFileSync(path, 'utf8');
          html = html.replace('<html lang="en">', `<html lang="en" data-voting="${voting}"${apiAttribute}>`);
          fs.writeFileSync(path, html);
          NODE
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
